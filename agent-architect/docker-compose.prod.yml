services:
  # Aplicación empaquetada (Backend + Frontend)
  hackatin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackatin-prod
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
