spring.application.name=hackatin

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/hackatin;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAI config (set OPENAI_API_KEY env var to use real API)
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# Session cookie
server.servlet.session.cookie.name=HACKATIN_SESSION
server.servlet.session.timeout=2h
