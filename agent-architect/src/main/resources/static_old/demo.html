<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neural Orchestration · Team WhatsApp Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --wa-bg: #0b141a;
    --wa-panel: #111b21;
    --wa-header: #202c33;
    --wa-chat-bg: #0b141a;
    --wa-pattern: #0a1014;
    --wa-bubble-in: #202c33;
    --wa-bubble-out: #005c4b;
    --wa-text: #e9edef;
    --wa-text-dim: #8696a0;
    --wa-divider: #222d34;
    --wa-accent: #00a884;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: var(--wa-text);
    font-family: Inter, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .app {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
    background: var(--wa-panel);
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
  }
  /* Sidebar */
  .sidebar { background: var(--wa-panel); border-right: 1px solid var(--wa-divider); display: flex; flex-direction: column; }
  .sidebar-header {
    background: var(--wa-header);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .me { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 14px; flex-shrink: 0;
  }
  .avatar.boss     { background: linear-gradient(135deg,#3adffa,#00cbe6); color: #003d46; }
  .avatar.backend  { background: linear-gradient(135deg,#3adffa,#0077aa); }
  .avatar.frontend { background: linear-gradient(135deg,#c180ff,#6f00be); }
  .avatar.security { background: linear-gradient(135deg,#b1fe4d,#416a00); color: #0b141a; }
  .me-info .name { font-weight: 600; font-size: 14px; }
  .me-info .role { font-size: 11px; color: var(--wa-text-dim); }
  .sidebar-title { padding: 14px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--wa-text-dim); }
  .chat-item {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--wa-divider);
    cursor: pointer;
  }
  .chat-item.active { background: #2a3942; }
  .chat-item .name { font-weight: 600; font-size: 15px; }
  .chat-item .preview { font-size: 13px; color: var(--wa-text-dim); margin-top: 2px; }

  /* Main chat */
  .main { display: flex; flex-direction: column; background: var(--wa-chat-bg); position: relative; }
  .chat-header {
    background: var(--wa-header);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--wa-divider);
    z-index: 2;
  }
  .chat-header .group { display: flex; align-items: center; gap: 12px; }
  .group-title { font-weight: 600; }
  .group-sub { font-size: 12px; color: var(--wa-text-dim); }
  .group-icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg,#00a884,#005c4b);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
  }
  .reset-btn {
    background: transparent;
    border: 1px solid #2a3942;
    color: var(--wa-text-dim);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .reset-btn:hover { color: var(--wa-text); border-color: var(--wa-accent); }

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 6% 14px;
    background:
      radial-gradient(circle at 20% 10%, rgba(0,168,132,0.05), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(58,223,250,0.04), transparent 40%),
      var(--wa-pattern);
  }
  .chat-scroll::-webkit-scrollbar { width: 8px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 4px; }

  .msg-row { display: flex; margin-bottom: 10px; align-items: flex-end; gap: 8px; }
  .msg-row.out { justify-content: flex-end; }
  .msg-row .avatar { width: 32px; height: 32px; font-size: 12px; }

  .bubble {
    max-width: 62%;
    padding: 8px 12px 6px;
    border-radius: 8px;
    position: relative;
    box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
    font-size: 14.5px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .bubble.in  { background: var(--wa-bubble-in); border-top-left-radius: 0; }
  .bubble.out { background: var(--wa-bubble-out); border-top-right-radius: 0; }
  .bubble .sender {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .sender.backend  { color: #53bdeb; }
  .sender.frontend { color: #d39bfd; }
  .sender.security { color: #a7e87a; }
  .bubble .time {
    float: right;
    font-size: 10px;
    color: rgba(233,237,239,0.55);
    margin-left: 8px;
    margin-top: 4px;
  }
  .date-chip {
    text-align: center;
    margin: 12px 0;
  }
  .date-chip span {
    background: #1d282f;
    color: var(--wa-text-dim);
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 12px;
  }
  .typing {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0 0 48px;
    font-size: 12px;
    color: var(--wa-text-dim);
    min-height: 20px;
  }
  .typing .dots span {
    display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--wa-text-dim); margin: 0 1px;
    animation: blink 1.2s infinite;
  }
  .typing .dots span:nth-child(2) { animation-delay: .2s; }
  .typing .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }

  /* Composer */
  .composer {
    background: var(--wa-header);
    padding: 10px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-top: 1px solid var(--wa-divider);
  }
  .composer input {
    flex: 1;
    background: #2a3942;
    border: none;
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--wa-text);
    font-size: 15px;
    outline: none;
    font-family: inherit;
  }
  .composer input::placeholder { color: var(--wa-text-dim); }
  .composer button {
    background: var(--wa-accent);
    border: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .composer button:disabled { opacity: .5; cursor: not-allowed; }

  .suggestions {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 10px 16px 0;
    background: var(--wa-header);
  }
  .suggestions button {
    background: rgba(0,168,132,0.15);
    border: 1px solid rgba(0,168,132,0.3);
    color: #9ce2ca;
    padding: 6px 12px;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .suggestions button:hover { background: rgba(0,168,132,0.25); }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .bubble { max-width: 85%; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="me">
        <div class="avatar boss">JF</div>
        <div class="me-info">
          <div class="name">Jefe (tú)</div>
          <div class="role">Líder técnico</div>
        </div>
      </div>
      <a href="index.html" style="color: var(--wa-text-dim); text-decoration: none; font-size: 12px;">← volver</a>
    </div>
    <div class="sidebar-title">Chats</div>
    <div class="chat-item active">
      <div class="group-icon" style="width:48px;height:48px;">NO</div>
      <div style="flex:1; min-width:0;">
        <div class="name">Neural Orchestration Team</div>
        <div class="preview" id="sidebarPreview">Backend, Frontend, Security</div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <section class="main">
    <header class="chat-header">
      <div class="group">
        <div class="group-icon">NO</div>
        <div>
          <div class="group-title">Neural Orchestration Team</div>
          <div class="group-sub">Backend, Frontend, Security, tú</div>
        </div>
      </div>
      <button class="reset-btn" id="resetBtn">Nuevo chat</button>
    </header>

    <div class="chat-scroll" id="messages">
      <div class="date-chip"><span>Hoy</span></div>
    </div>

    <div class="typing" id="typing" style="display:none;">
      <span id="typingName">backend</span> escribiendo
      <span class="dots"><span></span><span></span><span></span></span>
    </div>

    <div class="suggestions" id="suggestions">
      <button data-msg="Hay que hashear las contraseñas de los usuarios antes de guardarlas. ¿Cómo lo hacemos?">Hashear contraseñas</button>
      <button data-msg="Tenemos que añadir login con JWT y refresh tokens">Login con JWT</button>
      <button data-msg="Necesito un formulario de registro con validación fuerte">Formulario de registro</button>
      <button data-msg="Proteger los endpoints críticos contra CSRF y XSS">CSRF/XSS</button>
    </div>

    <form class="composer" id="chatForm">
      <input id="chatInput" type="text" autocomplete="off" placeholder="Escribe un mensaje como jefe..." />
      <button id="sendBtn" type="submit" title="Enviar">➤</button>
    </form>
  </section>
</div>

<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");
const typingEl = document.getElementById("typing");
const typingName = document.getElementById("typingName");
const suggestionsEl = document.getElementById("suggestions");
const sidebarPreview = document.getElementById("sidebarPreview");

const AGENT_INFO = {
  backend:  { label: "Backend",  initials: "BE" },
  frontend: { label: "Frontend", initials: "FE" },
  security: { label: "Security", initials: "SEC" }
};

function nowTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addUserMessage(text) {
  const row = document.createElement("div");
  row.className = "msg-row out";
  row.innerHTML = `
    <div class="bubble out">
      ${escapeHtml(text)}
      <span class="time">${nowTime()} ✓✓</span>
    </div>
  `;
  messagesEl.appendChild(row);
  scrollBottom();
}

function addAgentMessage(agent, text) {
  const info = AGENT_INFO[agent] || AGENT_INFO.backend;
  const row = document.createElement("div");
  row.className = "msg-row in";
  row.innerHTML = `
    <div class="avatar ${agent}">${info.initials}</div>
    <div class="bubble in">
      <span class="sender ${agent}">${info.label}</span>
      ${escapeHtml(text)}
      <span class="time">${nowTime()}</span>
    </div>
  `;
  messagesEl.appendChild(row);
  scrollBottom();
  sidebarPreview.textContent = info.label + ": " + text.slice(0, 40) + (text.length > 40 ? "…" : "");
}

function showTyping(agent) {
  const info = AGENT_INFO[agent] || AGENT_INFO.backend;
  typingName.textContent = info.label;
  typingEl.style.display = "flex";
}
function hideTyping() { typingEl.style.display = "none"; }

function escapeHtml(s) {
  return s
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function handleSend(text) {
  if (!text) return;
  addUserMessage(text);
  input.value = "";
  sendBtn.disabled = true;

  try {
    const res = await fetch("/api/demo/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ message: text })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const msgs = data.messages || [];
    for (const m of msgs) {
      showTyping(m.agent);
      const delay = Math.min(1500, 500 + m.text.length * 15);
      await sleep(delay);
      hideTyping();
      addAgentMessage(m.agent, m.text);
      await sleep(250);
    }
  } catch (e) {
    hideTyping();
    addAgentMessage("backend", "⚠️ Error: " + e.message);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  handleSend(input.value.trim());
});

resetBtn.addEventListener("click", async () => {
  await fetch("/api/demo/reset", { method: "POST", credentials: "include" });
  messagesEl.innerHTML = '<div class="date-chip"><span>Hoy</span></div>';
  seedWelcome();
});

suggestionsEl.addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-msg]");
  if (!btn) return;
  handleSend(btn.dataset.msg);
});

function seedWelcome() {
  addAgentMessage("backend",  "¡Buenas jefe! Equipo listo para recibir instrucciones. 👋");
  addAgentMessage("frontend", "Ya tengo Figma abierto y la rama creada.");
  addAgentMessage("security", "Recuerda: nada a producción sin pasar por mí. 😌");
}

seedWelcome();
input.focus();
</script>

</body>
</html>
